<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Order - LUKU LEGIT</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="order">
    <nav class="navbar">
      <div class="nav-container">
        <div class="nav-logo">
          <img src="img/luku gold-01.png" alt="Luku Legit Logo" />
          <span>LUKU LEGIT</span>
        </div>
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="shop.html">Shop</a></li>
          <li><a href="order.html">Order</a></li>
          <li><a href="reviews.html">Reviews</a></li>
        </ul>
      </div>
    </nav>

    <section class="hero">
      <h1>Confirm Your Order <span>Premium Accuracy</span></h1>
      <p>Send order details instantly with optional sample uploads and fast admin review.</p>
    </section>

    <section class="products">
      <h2>Order Details</h2>
      <div class="panel-card" style="max-width:1120px; margin:0 auto; padding:2.2rem;">
        <div style="display:grid; gap:2rem; grid-template-columns: minmax(320px,1fr) 1.4fr; align-items:start;">
          <div>
            <div id="order-summary" style="padding:1.6rem; min-height:260px; background:rgba(255,215,0,0.06); border-radius:18px; border:1px solid rgba(255,215,0,0.12);"></div>
            <div style="margin-top:1rem; padding:1rem; border-radius:14px; background:rgba(255,215,0,0.04); display:flex; justify-content:space-between; align-items:center; gap:1rem;">
              <p style="margin:0; color:var(--text-dim);">Unsure about size? Chat with our fit experts.</p>
              <button id="order-chat-btn" class="btn btn-secondary">Size Chat</button>
            </div>
          </div>

          <form id="order-form" class="login-form" style="padding:1rem; background:rgba(0,0,0,0.04); border-radius:14px;">
            <div style="display:grid; gap:0.9rem;">
              <label for="shoe-model">Shoe model</label>
              <input id="shoe-model" type="text" placeholder="Auto-filled from selection or describe" required />

              <label for="size">Size (optional)</label>
              <input id="size" type="text" placeholder="EUR 40 / UK 7 / e.g. unsure" />

              <label for="name">Name</label>
              <input id="name" type="text" placeholder="Your full name" required />

              <label for="phone">Phone</label>
              <input id="phone" type="tel" placeholder="Phone number" required />

              <label for="email">Email (optional)</label>
              <input id="email" type="email" placeholder="Email for updates" />

              <label for="sample-image">Sample image (optional)</label>
              <input id="sample-image" type="file" accept="image/*" />

              <label for="notes">Notes (optional)</label>
              <textarea id="notes" rows="4" placeholder="Any additional preferences"></textarea>

              <button class="btn" type="submit">Submit Order</button>
            </div>
          </form>
        </div>
      </div>
    </section>

    <footer>
      <p>Keep it authentic. © 2026 Luku Legit.</p>
    </footer>

    <script src="js/script.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', function(){
        const selectedProduct = JSON.parse(localStorage.getItem('selectedProduct')|| '{}');
        const cart = JSON.parse(localStorage.getItem('cart')|| '[]');
        const items = cart.length ? cart : (selectedProduct.name ? [selectedProduct] : []);
        const total = items.reduce((s,i)=> s + (i.price||0), 0);
        const summary = document.getElementById('order-summary');
        const shoeModelInput = document.getElementById('shoe-model');
        const sizeInput = document.getElementById('size');
        const nameInput = document.getElementById('name');
        const phoneInput = document.getElementById('phone');
        const emailInput = document.getElementById('email');
        const notesInput = document.getElementById('notes');
        const sampleInput = document.getElementById('sample-image');
        const chatBtn = document.getElementById('order-chat-btn');

        if(items.length){
          summary.innerHTML = items.map(it=> `<p style="margin:.3rem 0"><strong>${it.name}</strong>${it.size? ' · '+it.size : ''}<br><span style="color:var(--text-dim)">Ksh ${it.price||0}</span></p>`).join('') + `<hr style="border-color:rgba(255,215,0,0.12)"/><p style="font-weight:700">Estimated total: Ksh ${total}</p>`;
          if(selectedProduct.name && !cart.length){ shoeModelInput.value = selectedProduct.name; shoeModelInput.readOnly = true; }
        } else {
          summary.innerHTML = `<p style="color:var(--text-dim)">No product selected. Describe the pair you want and our admin will advise.</p>`;
        }

        chatBtn.addEventListener('click', ()=> window.location.href = 'chat.html#chat-form');

        document.getElementById('order-form').addEventListener('submit', function(e){
          e.preventDefault();
          const product = shoeModelInput.value.trim();
          const size = sizeInput.value.trim() || 'Not specified';
          const name = nameInput.value.trim();
          const phone = phoneInput.value.trim();
          const email = emailInput.value.trim();
          const notes = notesInput.value.trim();

          if(!product || !name || !phone){ alert('Complete name, phone and product details'); return; }

          function save(sample){
            const order = { product, size, name, phone, email, notes, sample, items, total, status:'pending', timestamp: new Date().toISOString() };
            const orders = readJSON('orders', []);
            orders.push(order); writeJSON('orders', orders); writeJSON('latestOrder', order);
            pushAdminNotification('order_submitted','New order submitted', order);
            trackUserInteraction('order_submitted', order);
            alert('Order sent. Admin will contact you shortly.');
            this.reset();
          }

          if(sampleInput.files && sampleInput.files.length){
            const r = new FileReader(); r.onload = ()=> save(r.result); r.readAsDataURL(sampleInput.files[0]);
          } else { save(null); }
        });
      });
    </script>
  </body>
</html>
